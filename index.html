      --catW: 560px;
      --catH: 440px;

      /* Center column can be tuned without breaking rules */
      --colC: var(--catW);

      /* Debug gridlines */
      --gridOn: 1;                 /* 1=on, 0=off */
      --gridColor: #FFD400;
      --gridW: 2px;
      --gridGlow: 0 0 18px rgba(255,212,0,.35);

      --bg1:#0b1020;

      --muted: rgba(150,170,200,.78);
      --accent: rgba(90,210,255,.95);
      --gold: rgba(242,195,75,.95);
    }

    html,body{height:100%; margin:0; background: radial-gradient(1200px 600px at 50% 0%, rgba(90,210,255,.10), transparent 60%),

      linear-gradient(180deg, var(--bg0), var(--bg1)); color:var(--txt); font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;}

    /* ======= Header ======= */
    .shell{
      max-width: 1500px;

      padding: var(--shellPad);
    }

    .header{

    .brand .sub{font-size:12px; color: var(--muted); letter-spacing:.2px;}

    .how{

    /* ===== Industry Select Overlay ===== */

      background: rgba(0,0,0,.55);

    }
    .industryOverlay.on{ display:grid; }
    .industryPanel{

    .pill{

    .pill:before{

    .hint{
      color: rgba(150,170,200,.82);
      font-size: 12px;
      letter-spacing:.2px;
      display:flex;
      flex-direction:column;
      gap:4px;
      /* Give the tagline the full header runway (no truncation by max-width) */
      flex: 1;
      max-width: none;

      justify-content: center;
      min-width: 0;
    }

    .hintLine{
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;

        .tagline{
      position: relative;
      font-size: 34px;
      font-weight: 950;
      letter-spacing: .8px;
      line-height: 1.12;

      /* single line, never clip/ellipsis — we auto-fit via JS instead */
      white-space: nowrap;
      overflow: visible;
      text-overflow: clip;
      display: inline-block;

      /* High-impact gold w/ animated shimmer */
      color: transparent;
      background: linear-gradient(90deg,
        rgba(255, 245, 205, .95) 0%,
        rgba(255, 226, 122, .95) 18%,
        rgba(242,195,75,.98) 45%,
        rgba(255, 226, 122, .95) 70%,
        rgba(255, 245, 205, .95) 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      background-size: 220% 100%;
      animation: taglineShimmer 6.5s linear infinite;

      /* Depth + presence (reads on dark header) */
      text-shadow:
        0 0 24px rgba(242,195,75,.22),
        0 0 60px rgba(242,195,75,.10),
        0 10px 26px rgba(0,0,0,.55);
    }

    .tagline::after{
      content:"";
      position:absolute;
      left: 2%;
      right: 2%;
      bottom: -10px;
      height: 2px;
      border-radius: 999px;
      background: linear-gradient(90deg,
        rgba(242,195,75,0) 0%,
        rgba(242,195,75,.55) 20%,
        rgba(255,244,210,.75) 50%,
        rgba(242,195,75,.55) 80%,
        rgba(242,195,75,0) 100%
      );
      box-shadow: 0 0 22px rgba(242,195,75,.18);
      opacity: .95;
      pointer-events:none;
    }

    @keyframes taglineShimmer{
      0%{ background-position: 0% 50%; }
      100%{ background-position: 100% 50%; }
    }

    /* ======= Dashboard Absolute Grid ======= */
    .dashWrap{
      margin-top: 18px;
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(10,14,26,.55), rgba(6,8,14,.45));
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 18px 70px rgba(0,0,0,.65);
      padding: 18px;
      position:relative;
      overflow:hidden;
    }

    .dashboard{
      position: relative;
      width: 100%;
      height: calc(var(--catH) * 2 + var(--gap));
    }

    /* computed side widths = remaining space split into two columns with gap accounted */
    .cell{
      position:absolute;
      border-radius: 18px;
      overflow: hidden;
      background: rgba(0,0,0,.0);
      /* gridlines */
      outline: calc(var(--gridOn) * var(--gridW)) solid var(--gridColor);
      outline-offset: -1px;
      box-shadow: calc(var(--gridOn) * 1px) 0 0 0 rgba(0,0,0,0), calc(var(--gridOn) * 1px) 0 0 0 rgba(0,0,0,0);
    }
    .cell.gridGlow{
      box-shadow: 0 0 0 1px rgba(255,212,0,.25) inset, var(--gridGlow);
    }

    /* left/right widths computed with CSS calc */
    .cell.top.left{
      top:0; left:0;
      width: calc((100% - var(--colC) - (var(--gap) * 2)) / 2);
      height: var(--catH);
    }
    .cell.top.center{
      top:0;
      left: calc((100% - var(--colC)) / 2);
      width: var(--colC);
      height: var(--catH);
    }
    .cell.top.right{
      top:0; right:0;
      width: calc((100% - var(--colC) - (var(--gap) * 2)) / 2);
      height: var(--catH);
    }

    .cell.bottom.left{
      top: calc(var(--catH) + var(--gap)); left:0;
      width: calc((100% - var(--colC) - (var(--gap) * 2)) / 2);
      height: var(--catH);
    }
    .cell.bottom.center{
      top: calc(var(--catH) + var(--gap));
      left: calc((100% - var(--colC)) / 2);
      width: var(--colC);
      height: var(--catH);
    }
    .cell.bottom.right{
      top: calc(var(--catH) + var(--gap)); right:0;
      width: calc((100% - var(--colC) - (var(--gap) * 2)) / 2);
      height: var(--catH);
    }

    /* gap is visual; we render it by spacing cells with padding layer */
    .cell.top.left{ margin-right: var(--gap); }
    .cell.top.right{ margin-left: var(--gap); }
    .cell.bottom.left{ margin-right: var(--gap); }
    .cell.bottom.right{ margin-left: var(--gap); }
    /* NOTE: margins don't affect absolute positions; kept harmless. */

    .cell iframe{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      border:0;
      display:block;
      background: transparent;
    }
    .cell iframe{ z-index:1; }


    /* Responsive safeguard: if viewport is too narrow, reduce center width but keep rules */
    @media (max-width: 1180px){
      :root{ --catW: 520px; --catH: 420px; }
    }
    @media (max-width: 1040px){
      :root{ --catW: 480px; --catH: 400px; }
      .hint{display:none;}
    }
    @media (max-width: 920px){
      /* stacked fallback – still locked, just one column */
      .dashboard{ height: calc(var(--catH) * 6 + (var(--gap) * 5)); }
      .cell{ position:relative; width:100% !important; left:auto !important; right:auto !important; top:auto !important; margin:0 0 var(--gap) 0; height: var(--catH) !important; }
    }

    function fitTagline(){
      const el = document.querySelector('.tagline');
      const wrap = document.querySelector('.header .hint');
      if(!el || !wrap) return;

      // Reset to the designed size first
      el.style.fontSize = '';

      // Compute available width (leave a little breathing room)
      const maxW = Math.max(0, wrap.clientWidth - 12);
      if(maxW <= 0) return;

      // Shrink only if needed (down to a safe minimum)
      const minPx = 16;
      let size = parseFloat(getComputedStyle(el).fontSize) || 30;

      // Guard: if the font is huge due to inheritance, cap the first attempt
      size = Math.min(size, 42);

      // Reduce until it fits
      let guard = 0;
      while(el.scrollWidth > maxW && size > minPx && guard < 60){
        size -= 0.5;
        el.style.fontSize = size + 'px';
        guard++;
      }
    }

    let taglineFitTimer = null;
    window.addEventListener('resize', ()=>{

            if(host) host.style.setProperty('--syncDur', (15 / m).toFixed(3) + 's');
          } catch(_){ }

            if(!g) return;
            g.style.opacity = (g.style.opacity === '0') ? '1' : '0';
          });

          // Belt speed wiring
          const s = document.getElementById('beltSpeed');
          const v = document.getElementById('beltSpeedVal');
          function syncVal(){
            if(!s || !v) return;
            const m = parseFloat(s.value) || 1;
            v.textContent = m.toFixed(1) + '×';
            applySyncSpeed(m);
          }
          if(s){
            syncVal();
            s.addEventListener('input', syncVal);
            s.addEventListener('change', syncVal);
          }
        }, 0);
      }
    }

    function openHelpFor(moduleKey){
      const item = helpMap[moduleKey];
      if(!item) return;

      // Once a sector is selected, lock selection until user closes the help panel
      setHelpMode(false);

	      openOverlay(item.title, item.html, [
	        { label:'Close', className:'secondary', onClick: () => { closeOverlay(); } }
	      ], 'help');
    }

    // Capture help targets (iframes don't bubble clicks to parent)
    document.querySelectorAll('.helpHit').forEach(hit => {
      hit.addEventListener('click', () => {
        if(!helpMode) return;
        const k = hit.getAttribute('data-help');
        openHelpFor(k);
      });
    });

	    window.addEventListener('message', (ev) => {
      const msg = ev.data || {};
      if(msg.type === 'AIRONTOP_HELP_OPEN') openHelpIntro();
      if(msg.type === 'AIRONTOP_MENU_OPEN') openMenu(msg.menu);
      if(msg.type === 'AIRONGRID_HELP_TARGET') openHelpFor(msg.module);
    });
	  }

	  // Initialize overlay wiring safely
	  if(document.readyState === 'loading'){
	    document.addEventListener('DOMContentLoaded', initAIRONOverlay, { once:true });
	  } else {
	    initAIRONOverlay();
	  }

</script>
</body>
</html>
