<!-- ===========================
     AIRON • CAT CLUSTER ISLAND (Bottom Center)
     FIX: Independent left/right scroll rails (hidden scrollbars)
     CAT button fixed (never moves)
     Drop-in single file (HTML+CSS+JS)
     =========================== -->

<div id="airon-cat" class="ac">
  <div class="ac__top">
    <div class="ac__scopePill" id="acScopePill">Scope: <span id="acScopeText">Plantwide</span></div>
    <div class="ac__hint">Plantwide shows all 5 lines • Line scope highlights…</div>
  </div>

  <div class="ac__trend">
    <div class="ac__trendInner">
      <!-- lightweight grid background + axis labels -->
      <div class="ac__grid" aria-hidden="true"></div>
      <!-- Drawn traces canvas (resizes to container) -->
      <canvas class="ac__canvas" id="acCanvas" aria-hidden="true"></canvas>
      <!-- Active traces / legend (demo) -->
      <div class="ac__legend" id="acLegend" aria-label="Active graph traces"></div>
      <div class="ac__axis">
        <span>0h</span>
        <span>24h</span>
      </div>
    </div>
  </div>

  <div class="ac__bottom">
    <div class="ac__rail ac__rail--left ac__scrollStd" id="acRailLeft" aria-label="Production lines left rail"></div>

    <div class="ac__catFixed" aria-label="CAT">
      <button class="ac__catBtn" id="acCatBtn" type="button" aria-label="C.A.T.">
        <video class="ac__catVideo" autoplay muted loop playsinline preload="auto">
          <source src="../assets/cat-fire.mp4" type="video/mp4" />
        </video>
        <span class="ac__catGlow" aria-hidden="true"></span>
        <span class="ac__catText" aria-hidden="true">C A T</span>
      </button>
    </div>

    <div class="ac__rail ac__rail--right ac__scrollStd" id="acRailRight" aria-label="Production lines right rail"></div>
  </div>
</div>

<style>
  /* ===========================
     CAT CLUSTER ISLAND STYLES
     =========================== */

  #airon-cat, #airon-cat * { box-sizing: border-box; }

  #airon-cat.ac{
    height: 100%;
    width: 100%;
    min-height: 0;
    min-width: 0;
    padding: 14px 14px 16px;
    border-radius: 18px;
    background: radial-gradient(1200px 520px at 50% -20%, rgba(120,180,255,.18), transparent 55%),
                radial-gradient(900px 520px at 50% 120%, rgba(255,150,0,.10), transparent 55%),
                rgba(8,10,14,.85);
    border: 1px solid rgba(255,255,255,.10);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* top bar */
  .ac__top{
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 10px;
    min-height: 34px;
  }
  .ac__scopePill{
    display:inline-flex;
    align-items:center;
    gap: 8px;
    padding: 7px 10px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,.14);
    background: rgba(0,0,0,.35);
    color: rgba(230,240,255,.92);
    font-size: 12px;
    letter-spacing: .2px;
    white-space: nowrap;
  }
  .ac__hint{
    color: rgba(210,225,255,.62);
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* trend placeholder */
  .ac__trend{
    flex: 1 1 auto;
    min-height: 0;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,.10);
    background: rgba(0,0,0,.28);
    overflow: hidden;
    position: relative;
  }
  .ac__trendInner{
    position:absolute;
    inset: 10px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.08);
    background: linear-gradient(180deg, rgba(0,0,0,.18), rgba(0,0,0,.38));
    overflow: hidden;
  }

  /* Legend/trace chips (demo) */
  .ac__legend{
    position:absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    display:flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    pointer-events: none; /* informational only */
  }
  .ac__chip{
    display:inline-flex;
    align-items:center;
    gap: 6px;
    padding: 5px 8px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,.10);
    background: rgba(0,0,0,.28);
    color: rgba(225,235,255,.80);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .15px;
    white-space: nowrap;
  }
  .ac__chip b{
    color: rgba(255, 234, 0, .92);
    font-weight: 900;
  }
  .ac__chip--hint{
    font-weight: 700;
    color: rgba(210,225,255,.70);
  }
  .ac__grid{
    position:absolute;
    inset: 0;
    background:
      linear-gradient(to right, rgba(255,255,255,.06) 1px, transparent 1px) 0 0 / 12.5% 100%,
      linear-gradient(to bottom, rgba(255,255,255,.06) 1px, transparent 1px) 0 0 / 100% 20%;
    opacity: .55;
  }

  /* Canvas sits above grid, below legend */
  .ac__canvas{
    position:absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
  }

  .ac__legend{ z-index: 2; }
  .ac__axis{ z-index: 2; }
  .ac__axis{
    position:absolute;
    left: 10px;
    right: 10px;
    bottom: 6px;
    display:flex;
    justify-content: space-between;
    color: rgba(200,215,245,.55);
    font-size: 11px;
  }

  /* bottom: two scroll rails + fixed CAT */
  .ac__bottom{
    flex: 0 0 46%;
    min-height: 140px;
    height: 46%;
    display: grid;
    grid-template-columns: 1fr 120px 1fr;
    gap: 12px;
    align-items: stretch;
    min-width: 0;
  }

  .ac__rail{
    min-width: 0;
    min-height: 0;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,.10);
    background: rgba(0,0,0,.24);
    padding: 10px;
    overflow: auto;               /* scroll lives here */
  }

  .ac__catFixed{
    display:flex;
    align-items: flex-end;
    justify-content: center;
    min-width: 0;
    min-height: 0;
    padding-bottom: 6px;
  }

  .ac__catBtn{
    width: 104px;
    height: 104px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,.20);
    background: radial-gradient(circle at 35% 30%, rgba(255,230,160,.40), transparent 38%),
                radial-gradient(circle at 60% 70%, rgba(255,140,0,.25), transparent 55%),
                rgba(0,0,0,.42);
    position: relative;
    cursor: pointer;
    outline: none;
    user-select: none;
    overflow: hidden;
  }

  .ac__catVideo{
    position:absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 999px;
    filter: contrast(1.05) saturate(1.15);
    opacity: .95;
  }
  .ac__catGlow{
    position:absolute;
    inset: 6px;
    border-radius: 999px;
    box-shadow:
      0 0 0 2px rgba(255,210,80,.25) inset,
      0 0 28px rgba(255,170,0,.35),
      0 0 60px rgba(255,100,0,.18);
    background: radial-gradient(circle at 40% 35%, rgba(255,210,80,.65), rgba(255,100,0,.22) 55%, transparent 72%);
    filter: saturate(1.25);
  }
  .ac__catText{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight: 900;
    letter-spacing: 6px;
    color: rgba(255,230,200,.95);
    text-shadow: 0 0 12px rgba(255,160,0,.35);
    font-size: 18px;
    opacity: 0; /* video replaces text; text remains for fallback/AT */
  }

  /* ===== Standard hidden-scroll method (OUR STANDARD) ===== */
  .ac__scrollStd{
    scrollbar-width: none;        /* Firefox */
    -ms-overflow-style: none;     /* IE/Edge legacy */
  }
  .ac__scrollStd::-webkit-scrollbar{
    width: 0;
    height: 0;
  }

  /* line cards */
  .ac__line{
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.10);
    background: rgba(10,14,22,.55);
    padding: 10px 10px 9px;
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: transform .08s ease, border-color .12s ease, background .12s ease;
  }
  .ac__line:hover{
    transform: translateY(-1px);
    border-color: rgba(255,210,80,.35);
  }
  .ac__lineTitle{
    font-weight: 800;
    font-size: 12.5px;
    color: rgba(235,245,255,.92);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .ac__lineMeta{
    margin-top: 4px;
    font-size: 11px;
    color: rgba(200,215,245,.55);
  }
  .ac__pillOz{
    flex: 0 0 auto;
    padding: 6px 8px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(0,0,0,.30);
    color: rgba(210,230,255,.78);
    font-weight: 800;
    font-size: 11px;
  }

  .ac__right{
    flex: 0 0 auto;
    display:flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
  }
  .ac__marks{
    display:flex;
    align-items:center;
    gap: 6px;
    min-height: 14px;
  }
  .ac__dot{
    width: 8px;
    height: 8px;
    border-radius: 999px;
    background: rgba(120, 220, 180, .95);
    box-shadow: 0 0 10px rgba(120, 220, 180, .20);
    opacity: 0;
    transition: opacity .12s ease;
  }
  .ac__star{
    font-size: 12px;
    line-height: 12px;
    color: rgba(255, 234, 0, .95);
    text-shadow: 0 0 10px rgba(255, 234, 0, .15);
    opacity: 0;
    transition: opacity .12s ease;
  }

  .ac__line.isActive{
    border-color: rgba(255, 234, 0, .70);
    box-shadow: 0 0 0 1px rgba(255,234,0,.25) inset;
    background: rgba(20, 18, 6, .35);
  }

  /* Graph membership + pin state */
  .ac__line.isOnGraph{
    box-shadow: 0 0 0 1px rgba(120,180,255,.18) inset;
  }
  .ac__line.isOnGraph .ac__dot{ opacity: 1; }
  .ac__line.isPinned .ac__star{ opacity: 1; }
</style>

<script>
  (function(){
    const left = document.getElementById('acRailLeft');
    const right = document.getElementById('acRailRight');
    const scopeText = document.getElementById('acScopeText');
    const legend = document.getElementById('acLegend');
    const canvas = document.getElementById('acCanvas');
    const trendInner = canvas ? canvas.parentElement : null;

    // --- Graph drawing (simple deterministic demo traces) ---
    let activeLine = 22;

    function mulberry32(seed){
      let t = seed >>> 0;
      return function(){
        t += 0x6D2B79F5;
        let r = Math.imul(t ^ (t >>> 15), 1 | t);
        r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
        return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
      };
    }

    function seriesForLine(n, count){
      // Stable per-line seed (demo)
      const rnd = mulberry32(0xA1A0C0DE ^ (n * 2654435761));
      const arr = new Array(count);
      let v = 0.55 + rnd()*0.15;
      for(let i=0;i<count;i++){
        // smooth random walk
        v += (rnd()-0.5)*0.10;
        v = Math.max(0.08, Math.min(0.92, v));
        arr[i] = v;
      }
      return arr;
    }

    function resizeCanvas(){
      if(!canvas || !trendInner) return;
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      const rect = trendInner.getBoundingClientRect();
      const w = Math.max(1, Math.floor(rect.width));
      const h = Math.max(1, Math.floor(rect.height));
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      const ctx = canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      redrawGraph();
    }

    function drawTrace(ctx, w, h, values, isActive){
      const padL = 22, padR = 12, padT = 34, padB = 20;
      const x0 = padL, x1 = w - padR;
      const y0 = padT, y1 = h - padB;
      const n = values.length;
      if(n < 2) return;

      ctx.beginPath();
      for(let i=0;i<n;i++){
        const t = i/(n-1);
        const x = x0 + t*(x1-x0);
        const y = y1 - values[i]*(y1-y0);
        if(i===0) ctx.moveTo(x,y);
        else ctx.lineTo(x,y);
      }

      ctx.lineWidth = isActive ? 2.2 : 1.6;
      ctx.strokeStyle = isActive ? 'rgba(255,234,0,.85)' : 'rgba(120,180,255,.55)';
      ctx.shadowBlur = isActive ? 12 : 6;
      ctx.shadowColor = isActive ? 'rgba(255,180,0,.35)' : 'rgba(120,180,255,.20)';
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    function redrawGraph(){
      if(!canvas) return;
      const ctx = canvas.getContext('2d');
      const rect = canvas.getBoundingClientRect();
      const w = rect.width;
      const h = rect.height;
      if(w <= 0 || h <= 0) return;

      // clear
      ctx.clearRect(0,0,w,h);

      // draw all "on graph" traces first (non-active)
      const lines = [...onGraph].sort((a,b)=>a-b);
      const count = 25;
      for(const ln of lines){
        if(ln === activeLine) continue;
        drawTrace(ctx, w, h, seriesForLine(ln, count), false);
      }

      // active line on top
      if(onGraph.has(activeLine)){
        drawTrace(ctx, w, h, seriesForLine(activeLine, count), true);
      }
    }

    // observe resize of the trend container
    if(trendInner && canvas){
      const ro = new ResizeObserver(() => resizeCanvas());
      ro.observe(trendInner);
      window.addEventListener('resize', resizeCanvas);
      // first paint
      setTimeout(resizeCanvas, 0);
    }

    const ozCycle = [12,16,24,16,24,12,16,24];

    // --- Selection model ---
    // Single click: toggle line ON/OFF in the graph
    // Double click: pin/unpin line to the "common graph" set (customer defaults)
    const pinned = new Set([1,2,3,4,5]);
    const onGraph = new Set([...pinned]);

    let clickTimer = null;

    function isPinned(n){ return pinned.has(n); }
    function isOnGraph(n){ return onGraph.has(n); }

    function updateCardState(card, n){
      if(!card) return;
      card.classList.toggle('isPinned', isPinned(n));
      card.classList.toggle('isOnGraph', isOnGraph(n));
    }

    function listPreview(arr, limit=7){
      if(arr.length <= limit) return arr.join(', ');
      const head = arr.slice(0, limit).join(', ');
      return `${head} … +${arr.length - limit}`;
    }

    function renderLegend(){
      if(!legend) return;

      const pinnedArr = [...pinned].sort((a,b)=>a-b).map(n => `L${String(n).padStart(2,'0')}`);
      const onArr = [...onGraph].sort((a,b)=>a-b).map(n => `L${String(n).padStart(2,'0')}`);

      legend.innerHTML = `
        <div class="ac__chip ac__chip--hint">Single-click: toggle trace • Double-click: pin</div>
        <div class="ac__chip"><b>Pinned</b>: ${pinnedArr.length ? listPreview(pinnedArr) : '—'}</div>
        <div class="ac__chip"><b>Graphing</b>: ${onArr.length ? listPreview(onArr) : '—'}</div>
      `;
    }

    function makeLineCard(n, plantLabel){
      const oz = ozCycle[(n-1) % ozCycle.length];
      const el = document.createElement('div');
      el.className = 'ac__line';
      el.setAttribute('data-line', String(n));
      el.setAttribute('data-oz', String(oz));

      el.innerHTML = `
        <div style="min-width:0;">
          <div class="ac__lineTitle">Line ${String(n).padStart(2,'0')} — ${plantLabel}</div>
          <div class="ac__lineMeta">Line ID: ${String(n).padStart(2,'0')}</div>
        </div>
        <div class="ac__right">
          <div class="ac__pillOz">${oz} oz</div>
          <div class="ac__marks" aria-hidden="true">
            <span class="ac__dot" title="In graph"></span>
            <span class="ac__star" title="Pinned">★</span>
          </div>
        </div>
      `;

      // click vs dblclick: we debounce so single click doesn't also fire on double click
      el.addEventListener('click', () => {
        if(clickTimer) clearTimeout(clickTimer);
        clickTimer = setTimeout(() => {
          clickTimer = null;
          toggleOnGraph(n, oz);
        }, 220);
      });

      el.addEventListener('dblclick', (e) => {
        e.preventDefault();
        if(clickTimer){ clearTimeout(clickTimer); clickTimer = null; }
        togglePinned(n, oz);
      });

      updateCardState(el, n);
      return el;
    }

    function clearActive(){
      document.querySelectorAll('#airon-cat .ac__line.isActive').forEach(x => x.classList.remove('isActive'));
    }

    function setActive(n, oz){
      clearActive();
      const card = document.querySelector(`#airon-cat .ac__line[data-line="${n}"]`);
      if(card) card.classList.add('isActive');
      scopeText.textContent = `Line ${String(n).padStart(2,'0')} (${oz} oz)`;
      activeLine = n;
      redrawGraph();
    }

    function toggleOnGraph(n, oz){
      setActive(n, oz);
      if(onGraph.has(n)) onGraph.delete(n); else onGraph.add(n);
      const card = document.querySelector(`#airon-cat .ac__line[data-line="${n}"]`);
      updateCardState(card, n);
      renderLegend();
      redrawGraph();
    }

    function togglePinned(n, oz){
      setActive(n, oz);
      if(pinned.has(n)) pinned.delete(n); else pinned.add(n);
      // Pinning implies the line is available for default graphing; keep it ON when pinned.
      if(pinned.has(n)) onGraph.add(n);
      const card = document.querySelector(`#airon-cat .ac__line[data-line="${n}"]`);
      updateCardState(card, n);
      renderLegend();
      redrawGraph();
    }

    // Build 40 lines (20 each rail) for stress testing
    for(let i=1;i<=20;i++){
      left.appendChild(makeLineCard(i, 'Plant A'));
    }
    for(let i=21;i<=40;i++){
      right.appendChild(makeLineCard(i, 'Plant B'));
    }

    // Default active (matches your screenshot pattern)
    setActive(22, ozCycle[(22-1) % ozCycle.length]);
    renderLegend();
  })();
</script>
<script>
  (function(){
    const btn = document.getElementById('acCatBtn');
    if(!btn) return;
    btn.setAttribute('role','button');
    btn.setAttribute('tabindex','0');
    btn.setAttribute('aria-label','Open C.A.T.A.S.T.R.O.P.H.E. tablet demo');

    function go(){
      // Works from inside an iframe embedded in the dashboard.
      const url = '/catastrophe/';
      try{ window.top.location.href = url; }
      catch(e){ window.location.href = url; }
    }

    btn.addEventListener('click', go);
    btn.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); go(); }
    });
  })();
</script>
